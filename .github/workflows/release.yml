name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (must match AndroidManifest.xml)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate release tag
        shell: bash
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build tools
        shell: bash
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: Restore release signing key
        shell: bash
        env:
          GLIDE_KEYSTORE_BASE64: ${{ secrets.GLIDE_KEYSTORE_BASE64 }}
        run: |
          test -n "$GLIDE_KEYSTORE_BASE64" || { echo 'Missing release signing key secret'; exit 1; }
          GLIDE_KEYSTORE="$RUNNER_TEMP/glide-release.jks"
          printf 'GLIDE_KEYSTORE=%s\n' "$GLIDE_KEYSTORE" >> "$GITHUB_ENV"
          umask 077
          printf '%s' "$GLIDE_KEYSTORE_BASE64" | base64 --decode > "$GLIDE_KEYSTORE"
      - name: Build and verify signed APK
        env:
          GLIDE_KEYSTORE_PASSWORD: ${{ secrets.GLIDE_KEYSTORE_PASSWORD }}
          GLIDE_KEY_PASSWORD: ${{ secrets.GLIDE_KEY_PASSWORD }}
          GLIDE_KEY_ALIAS: ${{ secrets.GLIDE_KEY_ALIAS }}
        run: bash ./build.sh
      - name: Package APK and update metadata
        run: python3 scripts/release-metadata.py --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GlideTV-${{ env.RELEASE_TAG }}
          path: build/release/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" build/release/* --clobber
          else
            gh release create "$RELEASE_TAG" build/release/* --verify-tag --title "Glide TV $RELEASE_TAG" --generate-notes
          fi
      - name: Remove runner signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/glide-release.jks"
