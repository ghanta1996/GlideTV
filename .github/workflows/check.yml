name: Check launcher

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_AVD_HOME: /tmp/glide-review-avd
      ANDROID_USER_HOME: /tmp/glide-android-user
      ANDROID_EMULATOR_HOME: /tmp/glide-android-user
      ADB_VENDOR_KEYS: /tmp/glide-android-user/adbkey
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Test icon palette
        run: bash scripts/test-icon-palette.sh
      - name: Install Android build tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: Build and verify development APK
        env:
          CI: 'false'
        run: bash build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GlideTV-development
          path: build/GlideTV.apk
          retention-days: 7
      - name: Build comparison APK
        if: github.event_name == 'pull_request'
        env:
          VISUAL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$VISUAL_BASE_SHA"
          git worktree add --detach build/visual-base "$VISUAL_BASE_SHA"
          cd build/visual-base
          CI=false bash build.sh
      - name: Start disposable screenshot emulator
        if: github.event_name == 'pull_request'
        run: |
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "emulator" "system-images;android-36;android-tv;x86_64"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"
          "$ANDROID_HOME/platform-tools/adb" keygen "$ADB_VENDOR_KEYS"
          "$ANDROID_HOME/platform-tools/adb" start-server
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n glide-review -k "system-images;android-36;android-tv;x86_64" --force
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx glide-review
          "$ANDROID_HOME/emulator/emulator" -avd glide-review -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 3072 -cores 2 > build/emulator.log 2>&1 &
          timeout 240 bash -c 'until "$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d "\r" | grep -q 1; do sleep 2; done'
      - name: Capture before and after with D-pad recording
        if: github.event_name == 'pull_request'
        env:
          VISUAL_BASE_APK: build/visual-base/build/GlideTV.apk
        run: bash scripts/capture-ui.sh
      - name: Upload actual runtime visual evidence
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GlideTV-visual-review
          path: |
            build/visual-review/
            build/emulator.log
          retention-days: 14
